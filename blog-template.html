<!DOCTYPE html>

<html lang='en'>

<head>
    <title>Cristi Cismas | {{ html_title }}</title>

    <meta name="description" content="{{ html_description }}" />

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preload" as="font" href="/font/LibreBaskerville.ttf" crossorigin>
    <link rel="preload" as="font" href="/font/FiraCode.ttf" crossorigin>
    <link rel="preload" as="font" href="/font/Inter.woff2" crossorigin>

    <link rel='stylesheet' href='../styles.css' />

    <style type="text/css">
        body {
            background: #161826;
        }
    </style>

    <!-- Highlight.JS -->
    <link rel="stylesheet" href="/lib/highlight/styles/github-dark.min.css" />
    <script src="/lib/highlight/highlight.min.js"></script>
    <script src="/lib/highlight/languages/x86asm.min.js"></script>
    <script>
        hljs.registerLanguage("odin", function (e) {
            return {
                aliases: ["odin", "odinlang", "odin-lang"],
                keywords: {
                    keyword: "auto_cast bit_field bit_set break case cast context continue defer distinct do dynamic else enum fallthrough for foreign if import in map matrix not_in or_else or_return package proc return struct switch transmute type_of typeid union using when where",
                    literal: "true false nil",
                    built_in: "abs align_of cap clamp complex conj expand_to_tuple imag jmag kmag len max min offset_of quaternion real size_of soa_unzip soa_zip swizzle type_info_of type_of typeid_of"
                },
                illegal: "</",
                contains: [e.C_LINE_COMMENT_MODE, e.C_BLOCK_COMMENT_MODE, {
                    className: "string",
                    variants: [e.QUOTE_STRING_MODE, {
                        begin: "'",
                        end: "[^\\\\]'"
                    }, {
                        begin: "`",
                        end: "`"
                    }]
                }, {
                    className: "number",
                    variants: [{
                        begin: e.C_NUMBER_RE + "[ijk]",
                        relevance: 1
                    }, e.C_NUMBER_MODE]
                }]
            }
        });
    </script>
    <script>hljs.highlightAll();</script>
</head>

<body>
    <header>
        <div class="inner-header-container">

            <a class='link' href="/index.html">Home</a>

            <div class="right-side">
                <a class='link' href="/blog.html">
                    <img src='/icons/blog.svg' width='18' height='18' alt='' />
                    Blog</a>
                <a class='link' href="/projects.html">
                    <img src='/icons/projects.svg' width='18' height='18' alt='' />
                    Projects</a>
            </div>
        </div>
    </header>

    <main>
        <section class='section blog'>
            <div>
                <div id='table-of-contents'>
                    <p class='toc-title'>Table of contents</p>
                </div>

                {{ dynamic_html }}

                <button type='button' id="scroll-up-button"><img src='/icons/up_arrow.svg' width='50'
                        height='50' /></button>
            </div>
        </section>
    </main>

    <section id='contact'>
        <h1 id='contact-title'>Contact Info</h1>

        <p>
            If you have any questions, suggestions, or business inquiries,<br />please contact me at

            <a class='link' href="mailto:cristicismas@pm.me">
                <img src='/icons/mail.svg' width='18' height='18' alt='' />
                cristicismas@pm.me</a>, or on

            <a class='link' href='https://www.linkedin.com/in/cristi-cismas-409482151/' target='_blank'>
                <img src='/icons/linkedin.svg' width='18' height='18' alt='' />
                LinkedIn</a>.
        </p>
    </section>

    <footer>
        <p class="copyright">&copy; 2026 Cristi Cismas</p>
    </footer>

    <script src='/table_of_contents.js'></script>
    <script defer async src='/scroll_up_button.js'></script>
</body>

</html>
